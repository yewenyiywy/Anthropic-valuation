name: Model validation protocol
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy
      - run: python -m unittest discover -s evaluation -p 'test_*.py'
      - run: python -m evaluation.validation_gate --audit
      - name: Verify any proposed validated release
        if: ${{ hashFiles('evaluation/release_manifest.json') != '' }}
        run: python -m evaluation.validation_gate --manifest evaluation/release_manifest.json
